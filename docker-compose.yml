name: maruf-bot

services:
  db:
    image: postgres:16-alpine
    container_name: maruf-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aislide
      POSTGRES_USER: slidebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slidebot -d aislide"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    image: maruf-bot:latest
    container_name: maruf-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://slidebot:${POSTGRES_PASSWORD}@db:5432/aislide?schema=public
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
